<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ChatGPT 问题导航栏</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>ChatGPT 问题导航栏</h1>
    <span id="ver"></span>
  </header>

  <label class="row switch">
    <input type="checkbox" id="enabled">
    <span>启用导航栏</span>
  </label>

  <section id="status">
    <div class="badge" id="badge">检测中…</div>
    <dl id="info"></dl>
  </section>

  <div class="btns">
    <button id="rescan">重新扫描</button>
    <button id="preload" title="自动滚动整个对话，把分段加载的历史问题全部收入导航栏，完成后回到原位置">加载完整历史</button>
    <button id="copy">复制诊断信息</button>
  </div>

  <details>
    <summary>高级</summary>
    <label class="row"><input type="checkbox" id="debug"> 在页面控制台输出调试日志</label>
    <p class="note">诊断信息只包含计数和页面结构信息，不包含任何聊天文字。本扩展不联网、不读取 Cookie 或令牌。</p>
  </details>

  <script src="popup.js"></script>
</body>
</html>
